[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    # LangChain v1 / classic layer emits DeprecationWarnings for legacy APIs
    # that are still in active use in this codebase (e.g. ConversationBufferWindowMemory).
    ignore::DeprecationWarning:langchain_classic
    ignore::DeprecationWarning:langchain_community
    ignore::DeprecationWarning:langchain_core
    # langchain-community package-sunset notice — surfaced at import time in
    # ingestion.py; not actionable while the ecosystem completes migration.
    ignore:.*langchain-community.*:DeprecationWarning
    # sentence-transformers / torch internal warnings are not actionable.
    ignore::UserWarning:torch
    ignore::FutureWarning:transformers
    # pydantic-settings v2 emits PydanticDeprecatedSince20 for v1-style APIs
    # found in langchain internals (not in our own Settings class — see config.py).
    ignore::pydantic.warnings.PydanticDeprecatedSince20
